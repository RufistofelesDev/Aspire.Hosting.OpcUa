name: Publish to NuGet

# Manual on purpose. NuGet versions are permanent — they cannot be deleted or
# replaced, only unlisted — so publishing is a decision, not a side effect of
# pushing a commit. Add a `release: [published]` trigger later if you want tags
# to do it for you.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, test and pack, but do not push'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required: lets the job request a GitHub OIDC token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Nothing is published that has not built clean and passed its tests.
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: >
          dotnet pack src/Aspire.Hosting.OpcUa/Aspire.Hosting.OpcUa.csproj
          -c Release --no-build
          -p:RepositoryCommit=${{ github.sha }}
          -o ./artifacts

      - name: Show what would ship
        run: |
          ls -l ./artifacts
          unzip -p ./artifacts/*.nupkg '*.nuspec'

      # Exchanges the OIDC token for a NuGet API key that lives ~1 hour and can
      # be used once. Requested here, immediately before the push, because an
      # early request can expire before it is used.
      - name: NuGet login (OIDC to short-lived key)
        if: ${{ !inputs.dry-run }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        if: ${{ !inputs.dry-run }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
